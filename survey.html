<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>乐理小达人 · Feedback / 试玩反馈</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f3;
      --ink: #1c1917;
      --muted: #78716c;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --line: #e7e5e4;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Fredoka", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #ffedd5 0%, transparent 55%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
      line-height: 1.55;
    }
    .card {
      max-width: 26rem;
      width: 100%;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 0.92rem; }
    .lang-row {
      display: grid;
      gap: 12px;
    }
    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      background: var(--accent);
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 1.05rem;
    }
    a.btn.secondary {
      color: var(--ink);
      background: var(--accent-soft);
      border: 1px solid var(--line);
    }
    a.btn:hover { filter: brightness(0.97); }
    a.btn .hint {
      font-weight: 500;
      font-size: 0.78rem;
      opacity: 0.85;
    }
    .back {
      display: inline-block;
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
    }
    .back:hover { color: var(--accent); }
    .note { margin-top: 16px; font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <h1>试玩反馈 / Feedback</h1>
    <p class="sub">选语言 · Choose language<br />约 2 分钟 · answers go to the author’s Tencent Survey</p>
    <div class="lang-row">
      <a class="btn" id="btnZh" href="https://wj.qq.com/s2/27402422/a11b/">
        中文问卷
        <span class="hint">提交即入库</span>
      </a>
      <a class="btn secondary" id="btnEn" href="survey-en.html">
        English survey
        <span class="hint">same questions</span>
      </a>
    </div>
    <div><a class="back" href="index.html">← 回乐理小达人 / Back</a></div>
    <p class="note">站内入口：页脚「试玩反馈」· Site entry: footer Feedback</p>
  </div>
  <script src="core/features.js"></script>
  <script>
    (function () {
      var zh = (typeof SURVEY_URL_ZH === "string" && SURVEY_URL_ZH) || "https://wj.qq.com/s2/27402422/a11b/";
      var enPage = "survey-en.html";
      var btnZh = document.getElementById("btnZh");
      var btnEn = document.getElementById("btnEn");
      if (btnZh) btnZh.href = zh;
      if (btnEn) {
        var en = (typeof SURVEY_URL_EN === "string" && SURVEY_URL_EN.trim()) || "";
        btnEn.href = en || enPage;
      }
      try {
        var lang = new URLSearchParams(location.search).get("lang");
        if (lang === "zh" || lang === "cn") {
          location.replace(zh);
          return;
        }
        if (lang === "en") {
          var enUrl = (typeof SURVEY_URL_EN === "string" && SURVEY_URL_EN.trim()) || "";
          location.replace(enUrl || enPage);
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>

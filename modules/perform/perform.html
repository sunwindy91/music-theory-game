<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>演奏练习 · 乐理小达人</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="perform.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; font-family: "Fredoka", "Segoe UI", sans-serif; color: #3d3a50;
      background: linear-gradient(160deg, #fff5e6 0%, #e8f4ff 100%);
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    .game-container {
      width: 100%; max-width: 520px; background: #fff; border-radius: 24px;
      box-shadow: 0 12px 40px rgba(124, 92, 255, 0.18); padding: 36px 32px 32px;
      border: 3px solid #f0ebff;
    }
    .header { text-align: center; margin-bottom: 24px; }
    .header-icon { font-size: 3rem; display: block; margin-bottom: 8px; }
    .header h1 { font-size: 1.75rem; font-weight: 700; color: #7c5cff; }
    .header p { margin-top: 6px; font-size: 0.95rem; color: #7a7590; }
  </style>
</head>
<body>
  <main class="game-container">
    <header class="header">
      <span class="header-icon" aria-hidden="true">🎹</span>
      <h1>演奏练习</h1>
      <p>钢琴 · 吉他 · 架子鼓，键盘即乐器</p>
    </header>
    <div id="performRoot"></div>
  </main>
  <script src="perform.js"></script>
  <script>
    PerformModule.mount(document.getElementById("performRoot"));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乐理小达人 · 学练一体</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-top: #fff5e6;
      --bg-bottom: #e8f4ff;
      --card: #ffffff;
      --primary: #7c5cff;
      --primary-dark: #5a3fd4;
      --accent: #ffb347;
      --accent-dark: #e89420;
      --success: #4cd964;
      --error: #ff6b6b;
      --text: #3d3a50;
      --text-light: #7a7590;
      --shadow: rgba(124, 92, 255, 0.18);
      --radius: 24px;
      --radius-sm: 14px;
      --chip-radius: 50px;
      --type-scale: 1;
    }

    /* I46 显示密度：标准 = 清爽略紧；儿童 = 大字少次要信息 */
    body[data-density="std"] {
      --bg-top: #f3f6fc;
      --bg-bottom: #e8eef8;
      --primary: #5f52d6;
      --primary-dark: #4739b8;
      --shadow: rgba(70, 90, 140, 0.14);
      --radius: 18px;
      --radius-sm: 12px;
      --chip-radius: 12px;
      --type-scale: 0.96;
    }
    body[data-density="std"] .game-container {
      border: 1px solid #d8e0ef;
      box-shadow: 0 10px 32px rgba(60, 80, 120, 0.1), 0 1px 4px rgba(0,0,0,0.04);
    }
    body[data-density="std"] .header-icon { font-size: 2.4rem; }
    body[data-density="std"] .header h1 { font-size: 1.55rem; letter-spacing: 0.04em; }
    body[data-density="std"] .header p { font-size: 0.88rem; }
    body[data-density="std"] .chip {
      border-radius: var(--chip-radius);
      font-size: 0.84rem;
      padding: 8px 14px;
      border-width: 1.5px;
    }
    body[data-density="std"] .setup-label { font-size: 0.78rem; letter-spacing: 0.04em; }
    body[data-density="std"] .setup-hint { font-size: 0.74rem; }
    body[data-density="std"] .btn-start { border-radius: 14px; font-size: 1.05rem; }
    body[data-density="std"] .question-area {
      background: #f7f9fd;
      border-color: #dce4f2;
    }

    body[data-density="kid"] {
      --bg-top: #fff3dc;
      --bg-bottom: #ffe9f2;
      --primary: #7c5cff;
      --primary-dark: #5a3fd4;
      --accent: #ff9f40;
      --shadow: rgba(124, 92, 255, 0.22);
      --radius: 28px;
      --radius-sm: 18px;
      --chip-radius: 18px;
      --type-scale: 1.08;
    }
    body[data-density="kid"] .game-container {
      border: 3px solid #ffe0a8;
      padding: 40px 28px 36px;
    }
    body[data-density="kid"] .header-icon { font-size: 3.4rem; }
    body[data-density="kid"] .header h1 { font-size: 2rem; }
    body[data-density="kid"] .header p { font-size: 1.05rem; font-weight: 500; }
    body[data-density="kid"] .chip {
      border-radius: var(--chip-radius);
      font-size: 1.05rem;
      padding: 14px 18px;
      border-width: 3px;
    }
    body[data-density="kid"] .setup-label { font-size: 0.95rem; color: var(--text); }
    body[data-density="kid"] .btn-start {
      font-size: 1.28rem;
      padding: 18px 28px;
      border-radius: 20px;
    }
    body[data-density="kid"] .density-advanced { display: none !important; }
    body[data-density="kid"] .setup-hint { font-size: 0.92rem; }

    .density-toggle {
      display: inline-flex;
      gap: 4px;
      margin: 12px auto 0;
      padding: 4px;
      background: rgba(255, 255, 255, 0.7);
      border: 1.5px solid #e0d8f5;
      border-radius: 999px;
    }
    .density-toggle button {
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 12px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-light);
      cursor: pointer;
    }
    .density-toggle button.selected {
      background: var(--primary);
      color: #fff;
    }
    body[data-density="std"] .density-toggle {
      border-radius: 10px;
      border-color: #cfd8ea;
    }
    body[data-density="std"] .density-toggle button,
    body[data-density="std"] .density-toggle button.selected {
      border-radius: 8px;
    }

    body {
      min-height: 100vh;
      font-family: "Fredoka", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .bg-notes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .bg-notes span { position: absolute; font-size: 2rem; opacity: 0.12; animation: float 6s ease-in-out infinite; }
    .bg-notes span:nth-child(1) { top: 8%;  left: 6%;  animation-delay: 0s;   font-size: 2.4rem; }
    .bg-notes span:nth-child(2) { top: 18%; right: 10%; animation-delay: 1s;   font-size: 1.8rem; }
    .bg-notes span:nth-child(3) { bottom: 22%; left: 12%; animation-delay: 2s; font-size: 2.2rem; }
    .bg-notes span:nth-child(4) { bottom: 10%; right: 8%; animation-delay: 0.5s; font-size: 1.6rem; }
    .bg-notes span:nth-child(5) { top: 45%; left: 3%;  animation-delay: 1.5s; font-size: 1.4rem; }
    .bg-notes span:nth-child(6) { top: 55%; right: 4%; animation-delay: 2.5s; font-size: 2rem; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-12px) rotate(6deg); }
    }

    .game-container {
      position: relative; z-index: 1; width: 100%; max-width: 520px;
      background: var(--card); border-radius: var(--radius);
      box-shadow: 0 12px 40px var(--shadow), 0 2px 8px rgba(0,0,0,0.06);
      padding: 36px 32px 32px; border: 3px solid #f0ebff;
    }

    /* I61 壳双核入口：学 ‖ 玩 并行，非单列学习 */
    .dual-gate {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 0 18px;
    }
    .dual-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      text-align: left; cursor: pointer; touch-action: manipulation;
      border-radius: 16px; padding: 14px 14px 12px;
      border: 2px solid transparent; font-family: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .dual-card strong {
      font-size: 1.35rem; letter-spacing: 0.12em; line-height: 1.1;
    }
    .dual-card span {
      font-size: 0.78rem; line-height: 1.35; opacity: 0.88; font-weight: 500;
    }
    .dual-card:hover { transform: translateY(-2px); }
    .dual-card:active { transform: translateY(0); }
    .dual-learn {
      background: linear-gradient(145deg, #f3eeff 0%, #e8f4ff 100%);
      border-color: rgba(124, 92, 255, 0.35);
      color: #4a35b0;
      box-shadow: 0 6px 18px rgba(90, 60, 180, 0.12);
    }
    .dual-play {
      background: linear-gradient(145deg, #fff4e8 0%, #ffe8f0 100%);
      border-color: rgba(255, 140, 90, 0.4);
      color: #a04020;
      box-shadow: 0 6px 18px rgba(200, 90, 40, 0.12);
    }
    body[data-density="kid"] .dual-card strong { font-size: 1.55rem; }
    body[data-density="kid"] .dual-card span { font-size: 0.9rem; }
    body[data-density="std"] .dual-card { border-radius: 12px; }
    .dual-gate-hint {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 0.72rem;
      line-height: 1.4;
      opacity: 0.72;
      color: var(--muted, #6b6280);
      text-align: center;
    }
    @media (max-width: 560px) {
      .dual-gate { grid-template-columns: 1fr; gap: 12px; }
      .dual-card {
        padding: 16px 16px 14px;
        min-height: 72px;
        -webkit-tap-highlight-color: transparent;
      }
      .dual-card strong { font-size: 1.5rem; }
      .dual-card span { font-size: 0.85rem; }
      .dual-gate-hint { font-size: 0.8rem; opacity: 0.85; text-align: left; }
    }
    .dual-gate-pulse {
      outline: 2px solid rgba(124, 92, 255, 0.55);
      outline-offset: 3px;
      animation: dual-pulse 0.9s ease 2;
    }
    @keyframes dual-pulse {
      0%, 100% { outline-color: rgba(124, 92, 255, 0.25); }
      50% { outline-color: rgba(124, 92, 255, 0.8); }
    }
    @media (min-width: 900px) {
      .game-container { max-width: 720px; padding: 40px 40px 36px; }
      body.hub-ready { overflow-x: hidden; }
      #bubbleHub {
        display: block;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 40;
      }
      #bubbleHub .bubble {
        pointer-events: auto;
        position: absolute;
        width: 72px; height: 72px;
        border-radius: 50%;
        border: 2.5px solid rgba(124, 92, 255, 0.35);
        background: radial-gradient(circle at 30% 28%, #fff 0%, #f3eeff 45%, #e8dcff 100%);
        box-shadow: 0 8px 24px rgba(90, 60, 180, 0.18);
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: 700;
        color: #5a3fd4;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 1.2;
        padding: 8px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        animation: bubble-float 4.5s ease-in-out infinite;
      }
      #bubbleHub .bubble:hover {
        transform: translateY(-4px) scale(1.06);
        box-shadow: 0 12px 28px rgba(90, 60, 180, 0.28);
      }
      #bubbleHub .bubble[data-hub="spirit"] {
        border-color: rgba(255, 160, 80, 0.45);
        background: radial-gradient(circle at 30% 28%, #fff 0%, #fff4e8 50%, #ffe0c0 100%);
        color: #c67600;
      }
      #bubbleHub .b1 { top: 18%; left: 4%; animation-delay: 0s; }
      #bubbleHub .b2 { top: 38%; left: 2.5%; animation-delay: 0.6s; }
      #bubbleHub .b3 { top: 58%; left: 5%; animation-delay: 1.2s; }
      #bubbleHub .b4 { top: 22%; right: 4%; animation-delay: 0.3s; }
      #bubbleHub .b5 { top: 44%; right: 2.5%; animation-delay: 0.9s; }
      #bubbleHub .b6 { top: 64%; right: 5%; animation-delay: 1.5s; }
      @keyframes bubble-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
    }
    #bubbleHub { display: none; }
    body.module-open #bubbleHub { display: none !important; }
    @media (max-width: 899px) {
      #bubbleHub { display: none !important; }
    }

    .header { text-align: center; margin-bottom: 24px; }
    .header-icon { font-size: 3rem; line-height: 1; margin-bottom: 8px; display: block; }
    .header h1 { font-size: 1.75rem; font-weight: 700; color: var(--primary); letter-spacing: 0.02em; }
    .header p { margin-top: 6px; font-size: 0.95rem; color: var(--text-light); }

    /* 开始设置区 */
    .setup-panel { margin-bottom: 8px; }
    .setup-label {
      font-size: 0.85rem; font-weight: 600; color: var(--text-light);
      margin-bottom: 10px; text-align: center;
    }
    .setup-group { margin-bottom: 18px; }
    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

    .chip {
      font-family: inherit; font-size: 0.9rem; font-weight: 600;
      padding: 10px 16px; border: 2.5px solid #e8e0ff; border-radius: var(--chip-radius, 50px);
      background: #fff; color: var(--text); cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s, color 0.15s;
    }
    .chip:hover { transform: translateY(-1px); border-color: var(--primary); }
    .chip.selected {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-color: var(--primary-dark); color: #fff;
      box-shadow: 0 4px 14px var(--shadow);
    }
    .chip-mode { flex: 1; min-width: 120px; text-align: center; }
    .chip-learn { flex: 1; min-width: 110px; text-align: center; }

    .chip-done {
      border-color: #4cd964 !important;
      background: linear-gradient(135deg, #eaffef, #fff) !important;
    }

    .setup-hint {
      text-align: center; font-size: 0.8rem; color: var(--text-light);
      margin-top: 4px; min-height: 1.2em;
    }

    .learn-recommend {
      background: linear-gradient(135deg, #f0fff4, #fff8ee);
      border: 2px solid #b8e6c8;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .learn-recommend.hidden { display: none; }
    .learn-recommend-label {
      font-size: 0.75rem; font-weight: 700; color: #2d8a5e;
      margin-bottom: 8px; letter-spacing: 0.03em;
    }
    .learn-recommend-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .learn-rec-btn {
      font-family: inherit; font-size: 0.82rem; font-weight: 600;
      padding: 8px 12px; border-radius: 999px; border: 2px solid #7c5cff;
      background: #fff; color: #5a3fd4; cursor: pointer;
      transition: transform 0.12s, background 0.12s;
    }
    .learn-rec-btn:hover { transform: translateY(-1px); background: #f5f0ff; }
    .learn-rec-btn.practice { border-color: #e89420; color: #c67600; }
    .learn-rec-btn.practice:hover { background: #fff8ee; }

    .score-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg, #f5f0ff, #fff8ee);
      border-radius: var(--radius-sm); padding: 14px 20px; margin-bottom: 16px;
      border: 2px dashed #ddd0ff;
    }
    .score-label { font-size: 0.9rem; color: var(--text-light); font-weight: 500; }
    .score-value { font-size: 1.6rem; font-weight: 700; color: var(--accent-dark); }
    .score-value .unit { font-size: 0.85rem; font-weight: 500; color: var(--text-light); margin-left: 2px; }
    .progress-text { font-size: 0.85rem; color: var(--text-light); font-weight: 500; text-align: right; }
    .diff-badge {
      display: block; font-size: 0.75rem; color: var(--primary); font-weight: 600; margin-top: 2px;
    }

    .combo-display {
      display: none; align-items: center; justify-content: center; gap: 6px;
      margin-bottom: 16px; padding: 10px 20px;
      background: linear-gradient(135deg, #fff0e0, #ffe8cc);
      border-radius: 50px; border: 2px solid #ffc87a;
      font-size: 1.1rem; font-weight: 700; color: #e8650a;
      animation: combo-pop 0.35s ease-out;
    }
    .combo-display.show { display: flex; }

    @keyframes combo-pop {
      0%   { transform: scale(0.85); opacity: 0.5; }
      60%  { transform: scale(1.08); }
      100% { transform: scale(1);   opacity: 1; }
    }

    .question-area {
      background: #faf8ff; border-radius: var(--radius-sm); padding: 28px 24px;
      min-height: 160px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      margin-bottom: 24px; border: 2px solid #ece6ff; transition: border-color 0.3s;
    }
    .question-area.active { border-color: var(--primary); }
    .question-area.correct { border-color: var(--success); background: #f0fff4; }
    .question-area.wrong   { border-color: var(--error);   background: #fff5f5; }

    .question-placeholder { color: var(--text-light); font-size: 1rem; line-height: 1.6; }
    .question-placeholder .emoji { font-size: 2.5rem; display: block; margin-bottom: 10px; }

    .question-type {
      display: inline-block; background: var(--primary); color: #fff;
      font-size: 0.75rem; font-weight: 600; padding: 4px 12px;
      border-radius: 20px; margin-bottom: 14px; letter-spacing: 0.04em;
    }

    .question-text { font-size: 1.25rem; font-weight: 600; line-height: 1.5; color: var(--text); }
    .question-hint { margin-top: 10px; font-size: 0.85rem; color: var(--text-light); }

    /* 听音区 */
    .audio-zone { margin-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .preview-gate {
      margin-top: 14px; padding: 12px 14px; border-radius: 12px;
      background: linear-gradient(135deg, #f5f0ff, #fff8ee);
      border: 2px dashed #ddd0ff; text-align: center;
    }
    .preview-gate p { font-size: 0.88rem; color: var(--text-light); margin-bottom: 10px; line-height: 1.5; }
    .preview-gate .btn-reveal {
      font-family: inherit; font-weight: 700; font-size: 0.9rem;
      padding: 10px 18px; border-radius: 999px; cursor: pointer;
      border: 2.5px solid var(--primary); background: #fff; color: var(--primary);
    }
    .preview-gate .btn-reveal:hover { background: #f5f0ff; }
    .preview-gate .btn-reveal:disabled { opacity: 0.5; cursor: wait; }
    .options-grid.gated { opacity: 0.35; pointer-events: none; filter: blur(1px); }

    .audio-visual {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, #e8deff, #fff0d0);
      border: 3px solid #d4c4ff; display: flex; align-items: center;
      justify-content: center; font-size: 2rem;
      animation: pulse-ring 1.5s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(124, 92, 255, 0.3); }
      50%      { box-shadow: 0 0 0 10px rgba(124, 92, 255, 0); }
    }
    .btn-replay {
      font-family: inherit; font-size: 0.85rem; font-weight: 600;
      padding: 8px 18px; border: 2px solid var(--primary); border-radius: 50px;
      background: #fff; color: var(--primary); cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-replay:hover { background: #f5f0ff; transform: translateY(-1px); }

    .options-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;
    }
    .option-btn {
      font-family: inherit; font-size: 1rem; font-weight: 600;
      padding: 14px 12px; border: 2.5px solid #e8e0ff; border-radius: var(--radius-sm);
      background: #fff; color: var(--text); cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .option-btn:hover:not(:disabled) {
      transform: translateY(-2px); border-color: var(--primary); box-shadow: 0 4px 12px var(--shadow);
    }
    .option-btn:disabled { cursor: default; opacity: 0.7; }
    .option-btn.selected-correct { border-color: var(--success); background: #eaffef; color: #2a9d4e; }
    .option-btn.selected-wrong   { border-color: var(--error);   background: #ffeaea; color: #d94040; }
    .option-btn.reveal-correct   { border-color: var(--success); background: #eaffef; }

    .action-area { text-align: center; }
    .btn-start {
      font-family: inherit; font-size: 1.15rem; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none; border-radius: 50px; padding: 16px 48px; cursor: pointer;
      box-shadow: 0 6px 20px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s; letter-spacing: 0.03em;
    }
    .btn-start:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 28px var(--shadow); }
    .btn-start.hidden { display: none; }

    .feedback-msg { margin-top: 14px; font-size: 0.95rem; font-weight: 600; min-height: 1.4em; }
    .feedback-msg.correct { color: var(--success); }
    .feedback-msg.wrong   { color: var(--error); }

    .result-panel { display: none; text-align: center; padding: 8px 0; }
    .result-panel.show { display: block; }
    .result-panel .result-emoji { font-size: 3rem; margin-bottom: 8px; }
    .result-panel h2 { font-size: 1.4rem; color: var(--primary); margin-bottom: 6px; }
    .result-panel p { color: var(--text-light); margin-bottom: 8px; }
    .result-combo { font-size: 1.05rem; font-weight: 700; color: #e8650a; margin-bottom: 20px; }

    .hidden { display: none !important; }

    /* 模块壳 */
    #symbolMatchRoot { display: none; }
    #symbolMatchRoot.active { display: block; }
    #performRoot { display: none; }
    #performRoot.active { display: block; }
    .quiz-shell.hidden { display: none !important; }

    /* 灵气星图 · 全屏模块 */
    #spiritJourneyRoot {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: #050818;
    }
    #spiritJourneyRoot.active { display: block; }
    #spiritJourneyRoot .sj-back {
      position: absolute; top: 14px; left: 14px; z-index: 510;
      font-family: inherit; font-size: 0.88rem; font-weight: 600;
      color: rgba(255,255,255,0.92); background: rgba(20,16,48,0.75);
      border: 1px solid rgba(160,120,255,0.45); border-radius: 999px;
      padding: 8px 16px; cursor: pointer; backdrop-filter: blur(8px);
    }
    #spiritJourneyRoot .sj-back:hover { background: rgba(90,65,180,0.85); }
    #spiritJourneyRoot .sj-frame { width: 100%; height: 100%; border: 0; display: block; }

    .chip-soon { opacity: 0.45; cursor: not-allowed; }
    .setup-group-future { margin-top: 4px; }

    .chip-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 5px;
      margin-left: 4px; font-size: 0.7rem; font-weight: 700;
      background: #ff6b6b; color: #fff; border-radius: 50px;
      vertical-align: middle;
    }
    .chip-badge.hidden { display: none; }

    #wrongBookRoot { display: none; }
    #wrongBookRoot.active { display: block; }
    #dailyChallengeRoot { display: none; }
    #dailyChallengeRoot.active { display: block; }
    #rhythmRoot { display: none; }
    #rhythmRoot.active { display: block; }
    #sightReadingRoot { display: none; }

  <script>
    if (window.APP_VERSION && document.getElementById("appVersionTag")) {
      document.getElementById("appVersionTag").textContent = APP_VERSION;
    }
    /* ── 模块壳：Tab 切换（不侵入答题逻辑） ── */
    (function AppShell() {
      const symbolRoot = document.getElementById("symbolMatchRoot");
      const performRoot = document.getElementById("performRoot");
      const wrongBookRoot = document.getElementById("wrongBookRoot");
      const dailyChallengeRoot = document.getElementById("dailyChallengeRoot");
      const rhythmRoot = document.getElementById("rhythmRoot");
      const sightReadingRoot = document.getElementById("sightReadingRoot");
      const theoryLearnRoot = document.getElementById("theoryLearnRoot");
      const instrumentRoot = document.getElementById("instrumentRoot");
      const spiritRoot = document.getElementById("spiritJourneyRoot");
      const quizShell = document.getElementById("quizShell");
      const scoreBar = document.getElementById("scoreBar");
      const comboDisplay = document.getElementById("comboDisplay");
      const difficultyGroup = document.getElementById("difficultyGroup");
      const reviewGroup = document.getElementById("reviewGroup");
      const btnStart = document.getElementById("btnStart");
      const headerSub = document.querySelector(".header p");
      function homeSub() {
        if (window.UiDensity && UiDensity.get) {
          return UiDensity.get() === "kid" ? "点下面开始学 · 边玩边会" : "先学乐理，再练技巧 · 快乐学音乐";
        }
        return "先学乐理，再练技巧 · 快乐学音乐";
      }
      let activeModule = "quiz";

      function hideAllModules() {
        symbolRoot.classList.remove("active");
        performRoot.classList.remove("active");
        wrongBookRoot.classList.remove("active");
        dailyChallengeRoot.classList.remove("active");
        rhythmRoot.classList.remove("active");
        sightReadingRoot.classList.remove("active");
        theoryLearnRoot.classList.remove("active");
        instrumentRoot.classList.remove("active");
        spiritRoot.classList.remove("active");
        spiritRoot.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        if (typeof ShareCardModule !== "undefined") ShareCardModule.close();
        SymbolMatchModule.unmount();
        if (typeof PerformModule !== "undefined") PerformModule.unmount();
        WrongBookModule.unmount();
        DailyChallengeModule.unmount();
        RhythmGameModule.unmount();
        SightReadingModule.unmount();
        if (typeof TheoryLearnModule !== "undefined") TheoryLearnModule.unmount();
        if (typeof InstrumentIntroModule !== "undefined") InstrumentIntroModule.unmount();
        SpiritJourneyModule.unmount();
      }

      function syncBubbleHub() {
        const hub = document.getElementById("bubbleHub");
        if (!hub) return;
        const onHome = activeModule === "quiz" && !quizShell.classList.contains("hidden");
        document.body.classList.toggle("hub-ready", onHome);
        document.body.classList.toggle("module-open", !onHome);
        hub.hidden = !onHome;
      }

      function clearChipSelection() {
        document.querySelectorAll("[data-mode]").forEach(b => b.classList.remove("selected"));
        document.querySelectorAll("[data-module]").forEach(b => b.classList.remove("selected"));
      }

      function refreshLearnBadges() {
        const theoryBadge = document.getElementById("theoryProgressBadge");
        const sightBadge = document.getElementById("sightProgressBadge");
        const theoryChip = document.getElementById("chipTheory");
        const sightChip = document.getElementById("chipSight");

        if (typeof TheoryLearnModule !== "undefined" && theoryBadge) {
          const done = TheoryLearnModule.completedCount();
          const total = TheoryLearnModule.totalCount();
          if (done > 0 && done < total) {
            theoryBadge.textContent = `${done}/${total}`;
            theoryBadge.classList.remove("hidden");
            theoryBadge.style.background = "#7c5cff";
          } else if (done >= total && total > 0) {
            theoryBadge.textContent = "✓";
            theoryBadge.classList.remove("hidden");
            theoryBadge.style.background = "#4cd964";
            if (theoryChip) theoryChip.classList.add("chip-done");
          } else {
            theoryBadge.classList.add("hidden");
            if (theoryChip) theoryChip.classList.remove("chip-done");
          }
        }

        if (typeof SightProgressStore !== "undefined" && sightBadge) {
          const total = (window.SIGHT_LESSONS || []).length;
          const done = SightProgressStore.completedCount();
          if (done > 0 && done < total) {
            sightBadge.textContent = `${done}/${total}`;
            sightBadge.classList.remove("hidden");
            sightBadge.style.background = "#7c5cff";
          } else if (done >= total && total > 0) {
            sightBadge.textContent = "✓";
            sightBadge.classList.remove("hidden");
            sightBadge.style.background = "#4cd964";
            if (sightChip) sightChip.classList.add("chip-done");
          } else {
            sightBadge.classList.add("hidden");
            if (sightChip) sightChip.classList.remove("chip-done");
          }
        }
      }

      window.refreshLearnBadges = refreshLearnBadges;

      function showQuizModule() {
        activeModule = "quiz";
        hideAllModules();
        document.body.classList.remove("module-open");
        quizShell.classList.remove("hidden");
        difficultyGroup.classList.remove("hidden");
        if (reviewGroup) reviewGroup.classList.remove("hidden");
        btnStart.classList.remove("hidden");
        headerSub.textContent = homeSub();
        if (typeof refreshReviewHint === "function") refreshReviewHint();
        refreshLearnBadges();
        if (typeof refreshLearnRecommend === "function") refreshLearnRecommend();
        if (window.LearningPath) {
          LearningPath.render(document.getElementById("learningPathRoot"));
        }
        if (typeof state !== "undefined" && !state.playing) {
          scoreBar.classList.remove("hidden");
        }
        syncBubbleHub();
      }

      function showWrongBookModule() {
        if (window.AppFeatures && !AppFeatures.wrongBook) return;
        activeModule = "wrongbook";
        quizShell.classList.add("hidden");
        scoreBar.classList.add("hidden");
        comboDisplay.classList.remove("show");
        hideAllModules();
        wrongBookRoot.classList.add("active");
        headerSub.textContent = "间隔复习，巩固薄弱知识点";
        WrongBookModule.mount(wrongBookRoot, {
          onBack: () => {
            document.querySelector('[data-mode="quiz"]').click();
            showQuizModule();
          },
          onRefreshBadge: () => {
            if (typeof refreshReviewHint === "function") refreshReviewHint();
            refreshLearnBadges();
          },
          onStartReview: (dueEntries) => {
            if (typeof startWrongBookReview === "function") {
              startWrongBookReview(dueEntries);
            }
          },
          onPracticeOne: (entry) => {
            if (typeof startWrongBookPractice === "function") {
              startWrongBookPractice(entry);
            }
          }
        });
      }

      function showDailyChallengeModule() {
        if (window.AppFeatures && !AppFeatures.dailyChallenge) return;
        activeModule = "daily";
        quizShell.classList.add("hidden");
        scoreBar.classList.add("hidden");
        comboDisplay.classList.remove("show");
        hideAllModules();
        dailyChallengeRoot.classList.add("active");
        headerSub.textContent = "每天 10 题，坚持打卡领 streak";
        DailyChallengeModule.mount(dailyChallengeRoot, {
          onBack: () => {
            document.querySelector('[data-mode="quiz"]').click();
            showQuizModule();
          },
          onStart: () => {
            if (typeof startDailyChallenge === "function") startDailyChallenge();
          }
        });
      }

      window.AppShell = {
        showQuizModule, showWrongBookModule, showDailyChallengeModule,
        showRhythmModule, showSightReadingModule, showTheoryLearnModule,
        showInstrumentModule, refreshLearnBadges,
        openTheoryLesson(id) {
          showTheoryLearnModule();
          if (id && typeof TheoryLearnModule !== "undefined") {
            setTimeout(() => TheoryLearnModule.startLesson(id), 30);
          }
        },
        openInstrumentLesson(kind, id) {
          showInstrumentModule(kind);
          if (id && typeof InstrumentIntroModule !== "undefined") {
            setTimeout(() => InstrumentIntroModule.startLesson(kind, id), 30);
          }
        },
        openSightDrill() {
          showSightReadingModule();
          setTimeout(() => {
            if (typeof SightReadingModule !== "undefined" && SightReadingModule.startDrill) {
              SightReadingModule.startDrill();
            }
          }, 40);
        }
      };

      window.refreshSpiritDisplay = function () {
        if (window.LearningPath) {
          LearningPath.render(document.getElementById("learningPathRoot"));
        }
      };

      function showTheoryLearnModule() {
        if (window.AppFeatures && !AppFeatures.theoryLearn) return;
        activeModule = "theory";
        quizShell.classList.add("hidden");
        scoreBar.classList.add("hidden");
        comboDisplay.classList.remove("show");
        hideAllModules();
        theoryLearnRoot.classList.add("active");
        headerSub.textContent = "乐理入门 · 先学后练";
        TheoryLearnModule.mount(theoryLearnRoot, {
          onBack: () => {
            clearChipSelection();
            document.querySelector('[data-mode="quiz"]').classList.add("selected");
            showQuizModule();
          },
          onProgressChange: () => {
            refreshLearnBadges();
            if (typeof refreshLearnRecommend === "function") refreshLearnRecommend();
            if (window.LearningPath) LearningPath.render(document.getElementById("learningPathRoot"));
          },
          onPracticeTopic: (topicId) => {
            if (typeof window.startTopicPractice === "function") window.startTopicPractice(topicId);
          }
        });
      }

      function showInstrumentModule(kind) {
        if (window.AppFeatures && !AppFeatures.instrumentIntro) return;
        activeModule = kind;
        quizShell.classList.add("hidden");
        scoreBar.classList.add("hidden");
        comboDisplay.classList.remove("show");
        hideAllModules();
        instrumentRoot.classList.add("active");
        headerSub.textContent = kind === "guitar"
          ? "吉他入门 · 六弦与和弦"
          : kind === "ukulele"
            ? "尤克里里入门 · 四弦 gCEA"
            : kind === "violin"
              ? "小提琴入门 · 四弦与运弓"
              : "钢琴入门 · 键盘与音名";
        InstrumentIntroModule.mount(instrumentRoot, {
          kind,
          onBack: () => {
            clearChipSelection();
            document.querySelector('[data-mode="quiz"]').classList.add("selected");
            showQuizModule();
          },
          onPracticeTopic: (topicId) => {
            if (typeof window.startTopicPractice === "function") window.startTopicPractice(topicId);
          }
        });
      }

      function showRhythmModule() {
        if (window.AppFeatures && !AppFeatures.rhythmGame) return;
        activeModule = "rhythm";
        quizShell.classList.add("hidden");
        scoreBar.classList.add("hidden");
        comboDisplay.classList.remove("show");
        hideAllModules();
        rhythmRoot.classList.add("active");
        headerSub.textContent = "节奏天国式跟拍 · 练时值感";
        RhythmGameModule.mount(rhythmRoot, {
          onBack: () => {
            document.querySelector('[data-mode="quiz"]').click();
            showQuizModule();
          }
        });
      }

      function showSightReadingModule() {
        if (window.AppFeatures && !AppFeatures.sightReading) return;
        activeModule = "sight";
        quizShell.classList.add("hidden");
        scoreBar.classList.add("hidden");
        comboDisplay.classList.remove("show");
        hideAllModules();
        sightReadingRoot.classList.add("active");
        headerSub.textContent = "五线谱入门 · 看谱认音";

    /** 题库由 core/quiz-bank.js 提供（80+ 道） */
    const QUESTIONS = window.QUIZ_BANK || window.QUESTIONS || [];

    const POINTS_PER_QUESTION = 20;
    const DIFF_LABELS = { 1: "初级", 2: "中级", 3: "高级" };
    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const NOTE_NAMES_FLAT = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

    // ── Web Audio 引擎 ──
    const AudioEngine = {
      ctx: null,

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      },

      midiToFreq(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      },

      playTone(freq, duration = 0.55, type = "sine", gain = 0.28, startDelay = 0) {
        this.init();
        const t = this.ctx.currentTime + startDelay;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(gain, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + duration + 0.05);
      },

      playNote(midi) {
        this.playTone(this.midiToFreq(midi), 0.7, "sine", 0.32);
      },

      playCorrect() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          this.playTone(f, 0.18, "sine", 0.22, i * 0.09);
        });
      },

      playWrong() {
        this.playTone(98, 0.45, "sawtooth", 0.18);
        this.playTone(73.42, 0.55, "triangle", 0.14, 0.18);
      }
    };

    // ── 工具函数 ──
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getQuestionCount(difficulty) {
      return { 1: 10, 2: 20, 3: 30 }[difficulty];
    }

    function filterQuizQuestions(difficulty) {
      const maxCount = getQuestionCount(difficulty);
      if (settings.topicId && window.LearnPracticeBridge) {
        const filtered = LearnPracticeBridge.filterByTopic(settings.topicId, difficulty, maxCount);
        if (filtered.length) return filtered;
      }
      const pool = QUESTIONS.filter(q => q.difficulty <= difficulty);
      return shuffle(pool).slice(0, maxCount);
    }

    function startTopicPractice(topicId) {
      if (window.AppShell) AppShell.showQuizModule();

      settings.topicId = topicId;

        b.classList.toggle("selected", b.dataset.mode === "quiz");
      });
      document.querySelectorAll("[data-difficulty]").forEach(b => {
        b.classList.toggle("selected", Number(b.dataset.difficulty) === 1);
      });
      if (typeof ShareCardModule !== "undefined") ShareCardModule.reset();
      updateSetupHint();
      startGame();
    }

    function refreshLearnRecommend() {
      const box = document.getElementById("learnRecommend");
      const row = document.getElementById("learnRecommendRow");
      if (!box || !row || !window.LearnPracticeBridge) return;
      const items = LearnPracticeBridge.getRecommendations();

        box.classList.add("hidden");

        }
        return `<button type="button" class="learn-rec-btn practice" data-rec-kind="practice" data-topic="${item.topicId}">${item.emoji} ${item.label}（${item.count}题）</button>`;
      }).join("");
      box.classList.remove("hidden");
      row.querySelectorAll("[data-rec-kind]").forEach(btn => {

          if (btn.dataset.recKind === "learn") {
            if (btn.dataset.module === "theory" && window.AppShell?.openTheoryLesson) {
              AppShell.openTheoryLesson(btn.dataset.lesson);

            startTopicPractice(btn.dataset.topic);
          }
        });
      });
    }
    window.refreshLearnRecommend = refreshLearnRecommend;

    function pickDistractors(correctName, pool, count = 3) {
      const others = pool.filter(n => n !== correctName);
      return shuffle(others).slice(0, count);
    }

    function buildAudioQuestion(difficulty) {
      let midiPool, namePool, useFlats = false;

      if (difficulty === 1) {
        midiPool = [60, 62, 64, 65, 67, 69, 71]; // C4–B4 自然音
        namePool = ["C", "D", "E", "F", "G", "A", "B"];
      } else if (difficulty === 2) {
        midiPool = [57, 58, 59, 60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72];
        namePool = NOTE_NAMES;
      } else {
        midiPool = Array.from({ length: 25 }, (_, i) => 55 + i); // G3–G5
        namePool = NOTE_NAMES;
        useFlats = Math.random() > 0.5;
      }

      const midi = midiPool[Math.floor(Math.random() * midiPool.length)];
      const idx = midi % 12;
      const correctName = useFlats ? NOTE_NAMES_FLAT[idx] : NOTE_NAMES[idx];
      const distractorPool = difficulty === 1 ? namePool : (useFlats ? NOTE_NAMES_FLAT : NOTE_NAMES);
      const distractors = pickDistractors(correctName, distractorPool);
      const options = shuffle([correctName, ...distractors]);
      const answer = options.indexOf(correctName);

      return {
        id: `audio-${midi}`,
        type: "听音识名",
        difficulty,
        isAudio: true,
        midi,
        text: "请听音，选择正确的音名",
        hint: difficulty === 1 ? "提示：自然音 Do Re Mi…" : "提示：注意升降号",
        options,
        answer
      };
    }

    function generateAudioQuestions(difficulty) {
      const count = getQuestionCount(difficulty);
      return Array.from({ length: count }, () => buildAudioQuestion(difficulty));
    }

      if (previewGate) previewGate.classList.add("hidden");
      if (optionsGrid) optionsGrid.classList.remove("gated");
      if (state) state.optionsRevealed = true;
    }

    function explainWhy(q) {
      if (!q) return "";
      if (q.why) return q.why;
      const correct = q.options && q.options[q.answer] != null ? q.options[q.answer] : "";
      if (q.hint) return `为什么：${q.hint} · 正解「${correct}」`;
      const topicTips = {
        "theory-notes": "对照五线谱线间口诀（线 EGBDF / 间 FACE）。",
        "theory-intervals": "数半音：大二=2，小三=3，大三=4，纯四=5，纯五=7。",
        "theory-triads": "大三=根+大三(+4)+纯五；小三=根+小三(+3)+纯五。",
        "theory-keys": "升号序 FCGDAEB；降号序反过来 BEADGCF。",
        "theory-accidentals": "♯ 升半音，♭ 降半音；E–F、B–C 本就半音。",
        "theory-meter": "拍号上方=每小节几拍，下方=以什么音符为一拍。",
        "intro-piano": "白键循环 CDEFGAB；相邻黑键多为半音。",
        "intro-guitar": "六弦空弦从粗到细 EADGBE，每品半音。"
      };
      const tip = topicTips[q.topicId] || "先听/先想再选，比硬猜更稳。";
      return `为什么：正确答案是「${correct}」。${tip}`;
    }

    function playCurrentNote() {
      const q = state.questions[state.currentIndex];
      if (q && q.isAudio) AudioEngine.playNote(q.midi);
    }

    function revealOptions(q) {
      if (!q) return;
      state.optionsRevealed = true;
      if (previewGate) previewGate.classList.add("hidden");
      optionsGrid.classList.remove("hidden", "gated");
      optionsGrid.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.type = "button";
        btn.textContent = opt;
        btn.addEventListener("click", () => handleAnswer(i, btn));
        optionsGrid.appendChild(btn);
      });
      state.answered = false;
    }

    function showQuestion(index) {
      const q = state.questions[index];
      resetQuestionArea();
      state.optionsRevealed = false;

      questionPlaceholder.classList.add("hidden");
      questionContent.classList.remove("hidden");
      questionArea.classList.add("active");

      questionType.textContent = q.type;
      questionText.textContent = q.text;
      // 提示先藏到揭晓后，减少「直接看提示选」
      questionHint.textContent = "";
      questionHint.style.display = "none";

      optionsGrid.innerHTML = "";
      optionsGrid.classList.add("hidden", "gated");

      if (q.isAudio) {
        audioZone.classList.remove("hidden");
        setTimeout(playCurrentNote, 280);
        if (previewGate) {
          previewGate.classList.remove("hidden");
          previewGateText.textContent = "先听音（可点「再听一次」）· 听清再选";
          btnRevealOptions.disabled = true;
          btnRevealOptions.textContent = "听完即可选…";
          setTimeout(() => {
            btnRevealOptions.disabled = false;
            btnRevealOptions.textContent = "我听好了 · 看选项";
          }, 900);
        }
      } else {
        audioZone.classList.add("hidden");
        if (previewGate) {
          previewGate.classList.remove("hidden");
          previewGateText.textContent = "先读题、想一想 · 再看选项（反刷题）";
          btnRevealOptions.disabled = false;
          btnRevealOptions.textContent = "想好了 · 看选项";
        }
      }

      // 最长 2.8s 自动揭晓，避免卡死；听音题稍晚
      const autoMs = q.isAudio ? 2800 : 1600;
      clearTimeout(showQuestion._revealTimer);
      showQuestion._revealTimer = setTimeout(() => {
        if (!state.playing || state.currentIndex !== index || state.optionsRevealed) return;
        if (q.hint) {
          questionHint.textContent = q.hint;
          questionHint.style.display = "block";
        }
        revealOptions(q);
      }, autoMs);

      updateProgress();
    }

    if (btnRevealOptions) {
      btnRevealOptions.addEventListener("click", () => {
        const q = state.questions[state.currentIndex];
        if (!q || state.optionsRevealed) return;
        clearTimeout(showQuestion._revealTimer);
        if (q.hint) {
          questionHint.textContent = q.hint;
          questionHint.style.display = "block";
        }
        revealOptions(q);
      });
    }

    function handleAnswer(selectedIndex, btn) {
      if (state.answered) return;
      state.answered = true;

      const q = state.questions[state.currentIndex];
      const isCorrect = selectedIndex === q.answer;
      const wrongOption = q.options[selectedIndex];
      const buttons = optionsGrid.querySelectorAll(".option-btn");
      buttons.forEach(b => b.disabled = true);

      if (state.reviewMode && state.reviewMode.type === "daily") {
        let points = 0;
        if (isCorrect) {
          AudioEngine.playCorrect();
          state.combo++;
          if (state.combo > state.maxCombo) state.maxCombo = state.combo;
          const comboBonus = state.combo * 2;
          points = POINTS_PER_QUESTION + comboBonus;
          btn.classList.add("selected-correct");
          questionArea.classList.add("correct");
          feedbackMsg.textContent = `太棒了！+${points} 分`;
          feedbackMsg.classList.add("correct");
          state.score += points;
          state.correctCount++;
          updateScore();
          updateComboDisplay();
        } else {
          AudioEngine.playWrong();
          state.combo = 0;
          updateComboDisplay();
          btn.classList.add("selected-wrong");
          questionArea.classList.add("wrong");
          buttons[q.answer].classList.add("reveal-correct");
          feedbackMsg.textContent = "再想想，正确答案是上方高亮的选项。 " + explainWhy(q);
          feedbackMsg.classList.add("wrong");
          if (!q.why) q.why = explainWhy(q);
          WrongBookStore.recordWrong(q, "daily", wrongOption);
        }
        DailyChallengeStore.recordAnswer(isCorrect, points);
        refreshReviewHint();
      } else if (state.reviewMode) {
        const entryId = state.reviewEntryIds[state.currentIndex];
        if (isCorrect) {
          AudioEngine.playCorrect();
          btn.classList.add("selected-correct");
          questionArea.classList.add("correct");
          if (state.reviewMode.type === "review") {
            WrongBookStore.recordReviewCorrect(entryId);
            state.reviewMode.stats.correct++;
            feedbackMsg.textContent = "复习正确，已延长下次复习间隔 ✓";
          } else {
            feedbackMsg.textContent = "答对了！继续加油 🎶";
          }
          feedbackMsg.classList.add("correct");
        } else {
          AudioEngine.playWrong();
          btn.classList.add("selected-wrong");
          questionArea.classList.add("wrong");
          buttons[q.answer].classList.add("reveal-correct");
          if (state.reviewMode.type === "review") {
            WrongBookStore.recordReviewWrong(entryId, wrongOption);
            state.reviewMode.stats.wrong++;
            feedbackMsg.textContent = "复习答错，已重置复习计划";
          } else {
            const entry = WrongBookStore.getById(entryId);
            WrongBookStore.recordWrong(q, entry ? entry.source : settings.mode, wrongOption);
            feedbackMsg.textContent = "再想想，正确答案是上方高亮的选项。 " + explainWhy(q);
          }
          feedbackMsg.classList.add("wrong");
        }
        refreshReviewHint();
      } else if (isCorrect) {
        AudioEngine.playCorrect();
        state.combo++;
        if (state.combo > state.maxCombo) state.maxCombo = state.combo;
        const comboBonus = state.combo * 2;
        btn.classList.add("selected-correct");
        questionArea.classList.add("correct");
        feedbackMsg.textContent = `太棒了！答对了 🎶 +${POINTS_PER_QUESTION + comboBonus} 分（连击 +${comboBonus}）`;
        feedbackMsg.classList.add("correct");
        state.score += POINTS_PER_QUESTION + comboBonus;
        state.correctCount++;
        updateScore();
        updateComboDisplay();
      } else {
        AudioEngine.playWrong();
        state.combo = 0;
        updateComboDisplay();
        btn.classList.add("selected-wrong");
        questionArea.classList.add("wrong");
        buttons[q.answer].classList.add("reveal-correct");
        feedbackMsg.textContent = "再想想，正确答案是上方高亮的选项。 " + explainWhy(q);
        feedbackMsg.classList.add("wrong");
        if (settings.mode === "quiz" || settings.mode === "audio") {
          if (!q.why) q.why = explainWhy(q);
          WrongBookStore.recordWrong(q, settings.mode, wrongOption);
          refreshReviewHint();
        }
      }

      setTimeout(() => {
        state.currentIndex++;
        if (state.currentIndex < state.questions.length) {
          showQuestion(state.currentIndex);
        } else if (state.reviewMode && state.reviewMode.type === "daily") {
          endDailyChallenge();
        } else if (state.reviewMode) {
          endReviewSession();
        } else {
          endGame();
        }
      }, 1400);
    }

    function beginSession(questions, entryIds, reviewMode) {
      AudioEngine.init();
      const initialScore = reviewMode && reviewMode.initialScore ? reviewMode.initialScore : 0;
      if (typeof ShareCardModule !== "undefined") ShareCardModule.reset();
      if (shareCardActions) shareCardActions.classList.add("hidden");

      state = {
        playing: true,
        questions,
        currentIndex: 0,
        score: initialScore,
        combo: 0,
        maxCombo: 0,
        correctCount: 0,
        answered: false,
        reviewMode,
        reviewEntryIds: entryIds || []
      };

      updateScore();
      updateComboDisplay();
      setupPanel.classList.add("hidden");
      if (reviewGroup) reviewGroup.classList.add("hidden");
      scoreBar.classList.remove("hidden");
      btnRestart.classList.remove("hidden");
      if (reviewMode) {
        if (reviewMode.type === "daily") {
          diffBadge.textContent = "每日挑战 · 中级";
        } else {
          diffBadge.textContent = reviewMode.type === "review" ? "错题复习" : "单题练习";
        }
        comboDisplay.classList.remove("show");
      } else if (settings.topicId && window.LearnPracticeBridge) {
        const meta = LearnPracticeBridge.getTopicMeta(settings.topicId);
        diffBadge.textContent = `${DIFF_LABELS[settings.difficulty]} · 专题 · ${meta.title}`;
      } else {
        diffBadge.textContent = `${DIFF_LABELS[settings.difficulty]} · ${settings.mode === "audio" ? "听音识名" : "综合练习"}`;
      }
      btnStart.classList.add("hidden");
      resultPanel.classList.remove("show");
      resultCombo.textContent = "";
      showQuestion(0);
    }

    function startWrongBookReview(dueEntries) {
      if (!dueEntries.length) return;
      if (window.AppShell) AppShell.showQuizModule();
      const questions = dueEntries.map(e => ({ ...e.question }));
      const entryIds = dueEntries.map(e => e.id);
      beginSession(questions, entryIds, { type: "review", stats: { correct: 0, wrong: 0 } });
    }

    function startWrongBookPractice(entry) {
      if (window.AppShell) AppShell.showQuizModule();
      beginSession([{ ...entry.question }], [entry.id], { type: "practice" });
    }

    function startDailyChallenge() {
      if (!DailyChallengeStore.canStart()) return;
      if (window.AppShell) AppShell.showQuizModule();
      const prog = DailyChallengeStore.getProgress();
      const allQuestions = DailyChallengeStore.generateToday({ quizPool: QUESTIONS });
      const questions = prog.current > 0 ? allQuestions.slice(prog.current) : allQuestions;
      if (!questions.length) return;
      beginSession(questions, [], { type: "daily", initialScore: prog.score, startOffset: prog.current });
    }

    function endDailyChallenge() {
      state.playing = false;
      const sessionScore = state.score;
      const sessionMaxCombo = state.maxCombo;
      DailyChallengeStore.markComplete();
      const streak = DailyChallengeStore.getStreak();

      optionsGrid.classList.add("hidden");
      questionContent.classList.add("hidden");
      audioZone.classList.add("hidden");
      questionPlaceholder.classList.remove("hidden");
      setupPanel.classList.remove("hidden");
      if (reviewGroup) reviewGroup.classList.remove("hidden");
      scoreBar.classList.add("hidden");
      diffBadge.textContent = "";
      resetQuestionArea();
      updateProgress();
      comboDisplay.classList.remove("show");
      refreshReviewHint();

      questionPlaceholder.innerHTML = `
        <span class="emoji">🎉</span>
        每日挑战完成！<br>
        得分 <strong>${state.score}</strong> · 🔥 连续 <strong>${streak}</strong> 天
      `;

      resultPanel.classList.remove("show");
      btnRestart.classList.add("hidden");
      state.reviewMode = null;
      state.reviewEntryIds = [];

      if (typeof DailyChallengeModule !== "undefined") {
        const dcRoot = document.getElementById("dailyChallengeRoot");
        if (dcRoot && dcRoot.classList.contains("active")) DailyChallengeModule.refresh();
      }

      showShareCardIfEnabled(buildDailySharePayload(sessionScore, sessionMaxCombo));
    }

    function startGame() {
      const questions = settings.mode === "audio"
        ? generateAudioQuestions(settings.difficulty)
        : filterQuizQuestions(settings.difficulty);
      beginSession(questions, [], null);
    }

    function endReviewSession() {
      state.playing = false;
      const stats = state.reviewMode.stats || { correct: 0, wrong: 0 };
      const total = state.questions.length;
      const isReview = state.reviewMode.type === "review";

      optionsGrid.classList.add("hidden");
      questionContent.classList.add("hidden");
      audioZone.classList.add("hidden");
      questionPlaceholder.classList.remove("hidden");
      setupPanel.classList.remove("hidden");
      if (reviewGroup) reviewGroup.classList.remove("hidden");
      scoreBar.classList.add("hidden");
      diffBadge.textContent = "";
      resetQuestionArea();
      updateProgress();
      comboDisplay.classList.remove("show");
      refreshReviewHint();

      if (isReview) {
        questionPlaceholder.innerHTML = `
          <span class="emoji">${stats.wrong === 0 ? "✨" : "📖"}</span>
          复习完成 · 共 ${total} 题<br>
          正确 <strong>${stats.correct}</strong> · 错误 <strong>${stats.wrong}</strong>
        `;
      } else {
        questionPlaceholder.innerHTML = `
          <span class="emoji">💪</span>
          单题练习完成<br>继续加油！
        `;
      }

      resultPanel.classList.remove("show");
      state.reviewMode = null;
      state.reviewEntryIds = [];
    }

    function endGame() {
      state.playing = false;
      optionsGrid.classList.add("hidden");
      questionContent.classList.add("hidden");
      audioZone.classList.add("hidden");
      questionPlaceholder.classList.remove("hidden");
      setupPanel.classList.remove("hidden");
      if (reviewGroup) reviewGroup.classList.remove("hidden");
      scoreBar.classList.add("hidden");
      diffBadge.textContent = "";
      refreshReviewHint();

      const total = state.questions.length;
      const maxScore = total * POINTS_PER_QUESTION;
      const ratio = state.score / maxScore;

      questionPlaceholder.innerHTML = `
        <span class="emoji">${ratio >= 0.8 ? "🏆" : "💪"}</span>
        本次得分 <strong>${state.score}</strong> 分<br>
        共 ${total} 题，继续加油！
      `;
      resetQuestionArea();
      updateProgress();
      comboDisplay.classList.remove("show");

      if (ratio >= 0.8) {
        resultEmoji.textContent = "🏆";
        resultTitle.textContent = "太厉害了！";
        resultDesc.textContent = `你获得了 ${state.score} 分（基础 ${maxScore} 分 + 连击奖励），乐理小达人非你莫属！`;
      } else if (ratio >= 0.5) {
        resultEmoji.textContent = "🎵";
        resultTitle.textContent = "不错哦！";
        resultDesc.textContent = `你获得了 ${state.score} 分（基础 ${maxScore} 分 + 连击奖励），再多练几题就能更棒！`;
      } else {
        resultEmoji.textContent = "📖";
        resultTitle.textContent = "继续加油！";
        resultDesc.textContent = `你获得了 ${state.score} 分（基础 ${maxScore} 分 + 连击奖励），复习一下再来挑战吧！`;
      }

      resultCombo.textContent = state.maxCombo >= 2
        ? `🔥 最高连击 x${state.maxCombo}`
        : "最高连击 x0";

      resultPanel.classList.add("show");
      showShareCardIfEnabled(buildQuizSharePayload());
    }

    if (btnShareCard) {
      btnShareCard.addEventListener("click", () => {
        let payload = ShareCardModule.getPayload();
        if (!payload) {
          payload = state.reviewMode && state.reviewMode.type === "daily"
            ? buildDailySharePayload()
            : buildQuizSharePayload();
        }
        ShareCardModule.openPreview(payload);
      });
    }

    btnReplay.addEventListener("click", playCurrentNote);
    btnStart.addEventListener("click", () => {
      if (typeof ShareCardModule !== "undefined") ShareCardModule.reset();
      startGame();
    });
    btnRestart.addEventListener("click", () => {
      if (typeof ShareCardModule !== "undefined") ShareCardModule.reset();
      startGame();
    });

    if (window.UxSimulator && UxSimulator.isEnabled()) {
      UxSimulator.mountUI();
    }
    if (window.PersonaSimulator && PersonaSimulator.isEnabled()) {
      PersonaSimulator.mountUI();
    }
  </script>
</body>
</html>
